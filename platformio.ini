[platformio]
; Only data/fs is packed into the spiffs partition by "pio run -t uploadfs".
; data/README.md therefore stays documentation and is not shipped to the guest --
; PlatformIO packs data_dir wholesale and has no exclude filter, so the payload
; lives one level down instead.
data_dir = data/fs

; Build and upload only the emulator by default. Without this, PlatformIO (and the Upload
; button in VSCode) acts on every environment in this file, which would also flash the
; benchmark. Run that one explicitly:  pio run -e psrambench -t upload
default_envs = esp32dev


; PCEmulator - IBM PC/XT emulator for ESP32, based on FabGL
; Converted from the Arduino IDE sketch (PCEmulator.ino).
;
; Hardware: ESP32 with PSRAM soldered + SD-CARD slot
;           (e.g. TTGO VGA32 v1.4 or FabGL Development Board with WROVER)

[env:esp32dev]
; espressif32 6.7.0 == arduino-esp32 2.0.17 / ESP-IDF 4.4.7.
; Pinned on purpose: src/main.cpp uses esp_spiram.h / esp_spiram_init_cache(),
; which were removed in ESP-IDF 5.x (arduino-esp32 3.x).
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

; Equivalent of the Arduino IDE's "Huge APP" partition scheme (3MB app).
board_build.partitions = partitions.csv
; contents of data/ are packed into the spiffs partition by "pio run -t uploadfs"
board_build.filesystem = spiffs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; QIO, as the Arduino IDE's "ESP32 Dev Module" defaults to. The 8086 core runs from flash through
; a cache it shares with PSRAM (guest RAM), so it refills constantly, and DIO halves the bandwidth
; of every refill: Topbench's opcode exercise went from 1383 us on DIO to 1077 on QIO.
; (The image header still says DIO; with qio PlatformIO picks the QIO bootloader and SDK libs.)
board_build.flash_mode = qio

; IMPORTANT: PSRAM is deliberately NOT enabled at build time.
; setup() calls esp_spiram_init() / esp_spiram_init_cache() itself, so that gcc's
; -mfix-esp32-psram-cache-issue workaround (which slows the CPU down too much for
; the emulator) is not applied. Do not add -DBOARD_HAS_PSRAM here.

; FabGL is vendored in lib/FabGL (see lib/FabGL/VENDORED.md) rather than fetched, because
; this project modifies emulator internals and .pio/libdeps is wiped by 'pio run -t fullclean'.
; PlatformIO compiles lib/* automatically, so no lib_deps entry is needed.
lib_ldf_mode = chain+

; the benchmarks are separate targets, keep them out of the emulator build
build_src_filter = +<*> -<psrambench.cpp> -<egabench.cpp>

monitor_speed = 115200
upload_speed = 921600


; PSRAM benchmark for the LIM-EMS design - not the emulator.
;   pio run -e psrambench -t upload
[env:psrambench]
extends = env:esp32dev
build_src_filter = -<*> +<psrambench.cpp>


; EGA planar memory path benchmark - not the emulator.
;   pio run -e egabench -t upload
[env:egabench]
extends = env:esp32dev
build_src_filter = -<*> +<egabench.cpp> +<ega.cpp>
