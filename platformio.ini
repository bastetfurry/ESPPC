[platformio]
; Only data/fs is packed into the spiffs partition by "pio run -t uploadfs".
; data/README.md therefore stays documentation and is not shipped to the guest --
; PlatformIO packs data_dir wholesale and has no exclude filter, so the payload
; lives one level down instead.
data_dir = data/fs

; Build and upload only the emulator by default. Without this, PlatformIO (and the Upload
; button in VSCode) acts on every environment in this file, which would also flash the
; benchmarks. Run that one explicitly:  pio run -e psrambench -t upload
default_envs = esp32dev


; ESPPC - IBM PC/XT emulator for ESP32, based on FabGL
; Started as FabGL's PCEmulator example sketch (PCEmulator.ino).
;
; Hardware: ESP32 with PSRAM soldered + SD-CARD slot
;           (e.g. TTGO VGA32 v1.4 or FabGL Development Board with WROVER)

[env:esp32dev]
; Plain ESP-IDF (5.2, from espressif32 6.7.0), no Arduino core: the few Arduino APIs the code uses
; are in src/compat.*, the IDF's settings in sdkconfig.defaults (delete sdkconfig.esp32dev after
; changing it, so it is generated again). FabGL 1.0.9 was made for IDF 4.4; lib/FabGL has the
; changes for 5.x (see lib/FabGL/VENDORED.md).
platform = espressif32@6.7.0
board = esp32dev
framework = espidf

; Equivalent of the Arduino IDE's "Huge APP" partition scheme (3MB app).
board_build.partitions = partitions.csv
; contents of data/ are packed into the spiffs partition by "pio run -t uploadfs"
board_build.filesystem = spiffs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; QIO: guest RAM in PSRAM and the code in flash share the cache, and DIO halves the bandwidth of
; every refill (Topbench's opcode exercise went from 1383 us on DIO to 1077 on QIO, on Arduino).
board_build.flash_mode = qio

; PSRAM is not given to the heap: setup() maps it with esp_psram_init(), and the guest's RAM sits
; at its start (see sdkconfig.defaults).

; FabGL is vendored in lib/FabGL (see lib/FabGL/VENDORED.md) rather than fetched, because
; this project modifies emulator internals and .pio/libdeps is wiped by 'pio run -t fullclean'.
; PlatformIO compiles lib/* automatically, so no lib_deps entry is needed.
lib_ldf_mode = chain+

; IDF 5's uint32_t is a long, and FabGL's log formats were written for an int
build_flags = -Wno-error=format
; the CPU core's place in IRAM (src/esppc_iram.ld), for the firmware's link only
extra_scripts = post:tools/esppc_link.py

monitor_speed = 115200
upload_speed = 921600
; An ESP32 before revision 3 (esptool's chip_id says "revision v1.x" or "v2.x") needs the PSRAM
; cache workaround: that is the esp32old build below.


; The firmware for ESP32s before revision 3: the same, with sdkconfig.oldchip on top of
; sdkconfig.defaults (the PSRAM cache workaround).
;   pio run -e esp32old -t upload
[env:esp32old]
extends = env:esp32dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.oldchip"


; The benchmarks and tests below are separate Arduino programs, not the emulator.
[bench]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_ldf_mode = chain+
monitor_speed = 115200
upload_speed = 921600


; PSRAM benchmark for the LIM-EMS design - not the emulator.
;   pio run -e psrambench -t upload
[env:psrambench]
extends = bench
build_src_filter = -<*> +<psrambench.cpp>


; EGA planar memory path benchmark - not the emulator.
;   pio run -e egabench -t upload
[env:egabench]
extends = bench
build_src_filter = -<*> +<egabench.cpp> +<ega.cpp>


; SD card write benchmark - not the emulator. Writes and deletes /SD/sdbench.tmp.
;   pio run -e sdbench -t upload
[env:sdbench]
extends = bench
build_src_filter = -<*> +<sdbench.cpp>


; Download throughput test - not the emulator. Network and TLS without SD card or VGA.
;   pio run -e dltest -t upload
[env:dltest]
extends = bench
build_src_filter = -<*> +<dltest.cpp> +<httpopen.cpp>


; U1 (Access_Bus header) wiring test - not the emulator. Sends "AB" forever at 38400 baud.
;   pio run -e uarttest -t upload
[env:uarttest]
extends = bench
build_src_filter = -<*> +<uarttest.cpp>
