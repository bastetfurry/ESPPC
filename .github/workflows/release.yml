# Builds a release when a version tag is pushed:
#
#   git tag v1.0 && git push origin v1.0
#
# It builds the firmware and the flash file system, attaches the images to a GitHub Release, and
# publishes the browser flasher (web/) with them on GitHub Pages. "Run workflow" on the Actions
# tab does the same for testing, but makes no release.
#
# The images are served from Pages and not from the release, because a browser may not fetch
# release downloads from another site (no CORS headers there).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # the release
  pages: write        # the flasher
  id-token: write     # required by deploy-pages

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build the firmware and the flash file system
        run: |
          pio run -e esp32dev
          pio run -e esp32dev -t buildfs

      - name: Collect the images and write the manifest
        run: |
          mkdir -p site
          cp web/index.html site/
          B=.pio/build/esp32dev
          cp $B/bootloader.bin $B/partitions.bin $B/firmware.bin $B/spiffs.bin site/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin site/
          # The offsets are the ESP32 bootloader's and partitions.csv's. NVS (0x9000) is left out on
          # purpose, so an update keeps the Wi-Fi and the settings.
          cat > site/manifest.json <<EOF
          {
            "name": "ESPPC",
            "version": "${GITHUB_REF_NAME}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "bootloader.bin", "offset": 4096 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "boot_app0.bin",  "offset": 57344 },
                  { "path": "firmware.bin",   "offset": 65536 },
                  { "path": "spiffs.bin",     "offset": 1900544 }
                ]
              }
            ]
          }
          EOF
          sed -i "s/@VERSION@/${GITHUB_REF_NAME}/" site/index.html

      - name: Make the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          gh release create "$GITHUB_REF_NAME" --title "ESPPC $GITHUB_REF_NAME" --generate-notes \
            bootloader.bin partitions.bin boot_app0.bin firmware.bin spiffs.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
